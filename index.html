<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Inspector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Pokémon Inspector Phase 4</h1>
    <p class="subtitle">Gen 4 (.sav / .dsv) Web Inspector</p>

    <!-- File Drop Zone -->
    <div id="drop-zone" class="drop-zone">
      <div class="drop-zone-content">
        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drag and drop your <strong>.sav</strong> or <strong>.dsv</strong> file here</p>
        <p class="subtext">or</p>
        <label for="file-input" class="btn">Select Save File</label>
        <input type="file" id="file-input" accept=".sav,.dsv" hidden>
      </div>
    </div>

    <!-- Parsed Output Results -->
    <div id="output" class="output-container"></div>
  </div>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
